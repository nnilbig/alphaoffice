<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>西區交易室 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
/* Layout: isometric 3D office stage on the left, Slack-like crew panel on the right; stacks on phones. Single committed dark look. */
:root{
  --bg:#141722;
  --panel:#191b24;
  --card:#20232e;
  --line:#2c3040;
  --text:#e9ecf2;
  --muted:#8d94a4;
  --gold:#ffd23f;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:14px;overflow:hidden}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 400px}
.stage{position:relative;min-width:0;min-height:0;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block;touch-action:none}
.hud{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:max(14px,env(safe-area-inset-left,0px));display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:none}
.title{pointer-events:auto;display:flex;gap:10px;align-items:center;background:rgba(20,22,32,.86);border:1px solid var(--line);border-radius:8px;padding:7px 12px}
.title b{color:var(--gold);font-size:15px}
.title span{color:var(--muted);font-size:12px;font-family:var(--f-mono)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.tools{position:absolute;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:6px}
.tools button{font:500 12px var(--f-body);color:var(--text);background:rgba(20,22,32,.86);border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer}
.tools button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.tools button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sign{position:absolute;transform:translate(-50%,-50%);font-weight:700;font-size:13px;padding:4px 12px;border-radius:999px;background:rgba(20,22,32,.88);border:1.5px solid currentColor;white-space:nowrap;pointer-events:none}
.hint{position:absolute;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--muted);background:rgba(20,22,32,.7);padding:5px 10px;border-radius:6px;pointer-events:none}

aside{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.sec{padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.sec h2{margin:0 0 10px;font-size:15px;display:flex;align-items:baseline;gap:8px}
.sec h2 small{font-weight:400;color:var(--muted);font-size:12px}
.crew{display:grid;gap:4px}
.member{all:unset;cursor:pointer;display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:center;padding:6px 8px;border-radius:8px;border:1px solid transparent}
.member:hover{background:#1f2230}
.member:focus-visible{outline:2px solid var(--gold)}
.member[aria-pressed="true"]{background:#23263a;border-color:#3a3f5a}
.member canvas{width:36px;height:36px;image-rendering:pixelated;border-radius:6px}
.member b{font-size:14px;display:block}
.member span{font-size:12px;color:var(--muted)}
.detail{margin-top:10px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:8px;font-size:13px;line-height:1.6}
.detail b{color:var(--gold)}
.chan{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.chan h3{margin:0;font-size:17px}
.chan h3 i{font-style:normal;color:var(--muted);margin-right:4px}
.chan .demo{margin-left:auto;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.feed{flex:1;overflow:auto;padding:10px 16px 16px;display:grid;gap:14px;align-content:start;min-height:0}
.msg{display:grid;grid-template-columns:34px 1fr;gap:10px;min-width:0}
.msg canvas{width:34px;height:34px;image-rendering:pixelated;border-radius:6px}
.msg .who{font-weight:700;font-size:14px}
.msg .t{font-family:var(--f-mono);font-size:11px;color:#6b7282;margin-left:8px}
.msg p{margin:2px 0 0;font-size:13px;color:#d7dbe4;line-height:1.55}
.sys{justify-self:center;font-size:12px;color:#9ec7ff;background:#1c2433;border:1px solid #2f4366;border-radius:999px;padding:4px 12px}

.report{flex:1;overflow:auto;min-height:0;padding:14px 16px 20px;display:grid;gap:14px;align-content:start}
.rhead{display:grid;grid-template-columns:auto 44px 1fr;gap:10px;align-items:center}
.back{all:unset;cursor:pointer;font-size:13px;color:var(--muted);padding:6px 8px;border-radius:6px;border:1px solid var(--line)}
.back:hover{color:var(--text)}.back:focus-visible{outline:2px solid var(--gold)}
.rhead canvas{width:44px;height:44px;image-rendering:pixelated;border-radius:8px}
.rhead b{display:block;font-size:16px}
.rhead span{font-size:12px;color:var(--muted)}
.rmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.chip{border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:11px}
.chip.demo{color:#e8c56b;border-color:#5a4a26}
.rsum{margin:0;padding:10px 12px;border-radius:8px;background:var(--card);border-left:3px solid var(--acc,#ffd23f);font-size:14px;line-height:1.65}
.rtbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.rtbl table{border-collapse:collapse;width:100%;font-size:13px}
.rtbl th,.rtbl td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.rtbl td:first-child{min-width:6em}
.rtbl td.n:last-child{font-size:12px}
.rtbl tr:last-child td{border-bottom:0}
.rtbl th{font-size:11px;color:var(--muted);font-weight:500;background:#1c1f2a}
.rtbl td.n,.rtbl th.n{text-align:right}
.rtbl td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.up{color:#ff5a4e}.down{color:#3fd17f}.flat{color:var(--muted)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#1c1f2a;border:1px solid var(--line);border-radius:8px;padding:3px}
.tabs button{all:unset;cursor:pointer;text-align:center;font-size:13px;padding:6px 0;border-radius:6px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:#2a2e40;color:var(--text);font-weight:700}
.tabs button:focus-visible{outline:2px solid var(--gold)}
.rlist{margin:0;padding-left:1.2em;display:grid;gap:6px;font-size:13.5px;line-height:1.6;color:#d7dbe4}
.rlist li::marker{color:var(--acc,#ffd23f)}
.obs{display:grid;gap:8px;margin:0;padding:0;list-style:none;counter-reset:o}
.obs li{counter-increment:o;display:grid;grid-template-columns:26px 1fr;gap:8px;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:8px;font-size:13.5px;line-height:1.55}
.obs li::before{content:counter(o);width:22px;height:22px;border-radius:6px;background:#2a3550;color:#9ec7ff;font:700 12px var(--f-mono);display:grid;place-items:center}
.obs small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.quote{margin:0;padding:16px;border-radius:10px;background:linear-gradient(180deg,#262138,#1f1b2e);border:1px solid #3a3058;font-size:16px;line-height:1.7;color:#efe6ff}
.rsrc{font-size:12px;color:var(--muted)}.rsrc a{color:#9aa6c0}
.rsrc ul{margin:4px 0 0;padding-left:1.2em;display:grid;gap:2px}
.ask{display:grid;gap:6px;border-top:1px dashed var(--line);padding-top:12px}
.ask label{font-size:12px;color:var(--muted)}
.askrow{display:flex;gap:6px}
.askrow input{flex:1;min-width:0;font:14px var(--f-body);background:#12141c;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.askrow input:focus-visible{outline:2px solid var(--gold)}
.askrow button{font:700 13px var(--f-body);background:var(--gold);color:#1a1408;border:0;border-radius:8px;padding:0 14px;cursor:pointer}
.askrow button:disabled{opacity:.5}
.ans{margin:0;white-space:pre-wrap;font-size:13.5px;line-height:1.6;background:#12141c;border:1px solid var(--line);border-radius:8px;padding:10px}
.msg{cursor:pointer;border-radius:8px;padding:4px;margin:-4px}
.msg:hover{background:#1f2230}
.member .open{font-size:11px;color:var(--muted)}
@media (max-width:860px){
  body{overflow:auto}
  .app{grid-template-columns:1fr;grid-template-rows:56vh auto;height:auto}
  .report{overflow:visible}
  aside{border-left:0;border-top:1px solid var(--line)}
  .feed{max-height:none}
  .hint{display:none}
}
@media (max-width:860px){.sec,.chan,.feed,.report{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage">
    <canvas id="gl" aria-label="西區交易室 3D 等角辦公室：辦公區六個座位、會議室、主管室與茶水間，點選貓咪可查看分工"></canvas>
    <div class="hud"><div class="title"><span class="dot"></span><b>西區交易室</b><span id="clock">--:--</span></div></div>
    <div class="hint">拖曳旋轉・滾輪縮放・點貓咪看分工</div>
    <div class="tools">
      <button id="pxBtn" aria-pressed="true">像素感</button>
      <button id="resetBtn">回到預設視角</button>
    </div>
  </div>
  <aside id="aside">
    <div class="sec" id="home">
      <h2>成員</h2>
      <div class="crew" id="crew"></div>
      <div class="detail" id="detail">點選貓咪或名單，打開牠的報告。</div>
    </div>
    <div class="report" id="report" hidden></div>
  </aside>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";

const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const stage=document.getElementById("stage"),canvas=document.getElementById("gl");

/* ---------- crew data ---------- */
const CREW={
  brown:{name:"棕貓",role:"國際事件與數據",detail:"整理前一日、今日、明日的國際事件與數據：美股、費半、匯率、國際行事曆。",col:"#3ad7ff",
    fur:"#9a6a42",furL:"#c79a72",eye:"#7fd0a0",shirt:"#2f6fb0",acc:"#ffffff",pants:"#2f3a55"},
  black:{name:"黑貓",role:"產業數據",detail:"整理前一日、今日、明日的產業數據：月營收、法說會、族群消息。",col:"#ffb43a",
    fur:"#34323f",furL:"#57556a",eye:"#ffe14a",shirt:"#c98a2a",acc:"#fff2c8",pants:"#2f2a3d"},
  orange:{name:"橘貓",role:"盤勢數據",detail:"整理前一日、今日、明日的盤勢數據：夜盤、三大法人、成交量、匯率。",col:"#3fd17f",
    fur:"#e8913a",furL:"#f6c58a",stripe:"#c96a1e",eye:"#5aa0e8",shirt:"#3a9a5a",acc:"#ffffff",pants:"#3a3a48"},
  tabby:{name:"斑紋貓",role:"情緒價值・交易修心",detail:"待在茶水間，提供情緒價值與交易修心策略：停損紀律、等待、穩住心態。",col:"#c9a9ff",
    fur:"#a39a8a",furL:"#d8d0c0",stripe:"#5f574a",eye:"#8fd06a",shirt:"#e9e2d0",acc:"#c25a4f",pants:"#6b4630"},
  white:{name:"白貓 ×4",role:"會議：今日重點觀察",detail:"四隻白貓在會議室，彙整三位同事的資料，討論今日重點觀察。",col:"#9ec7ff",
    fur:"#f6f3ee",furL:"#ffffff",eye:"#5ab0f0",shirt:"#4f7cc4",acc:"#ffffff",pants:"#2f3a55"}
};
const WHITE_SHIRTS=[["#4f7cc4","#5ab0f0"],["#c25a7a","#f0b84a"],["#5a5a6a","#7fd0a0"],["#3a9a8a","#b07bff"]];

/* ---------- pixel avatar (2D) ---------- */
const FACE=[".kk..........kk.",".kfk........kfk.",".kfPkkkkkkkkPfk.",".kfffzffffzfffk.",".kffzffffffzffk.",".kffyyffffyyffk.",".kffyeffffeyffk.",".kffffffffffffk.",".kFfffcPPcfffFk.",".kfFFffffffFFfk.","..kffffffffffk..","...kkffffffkk...","..kvvvvaavvvvk..",".kvvvvvaavvvvvk.","kfvvvvvvvvvvvvfk"];
function avatar(c,bg){const cv=document.createElement("canvas");cv.width=16;cv.height=16;const t=cv.getContext("2d");t.fillStyle=bg;t.fillRect(0,0,16,16);
  const pal={k:"#1d1820",f:c.fur,F:c.furL,z:c.stripe||c.fur,P:"#f1b6c4",y:c.eye,e:"#1d1820",c:"#e89aa8",v:c.shirt,a:c.acc};
  FACE.forEach((r,j)=>{for(let i=0;i<16;i++){const ch=r[i];if(ch!=="."&&pal[ch]){t.fillStyle=pal[ch];t.fillRect(i,j+1,1,1)}}});return cv}

/* ---------- renderer ---------- */
const renderer=new THREE.WebGLRenderer({canvas,antialias:false});
renderer.setPixelRatio(1);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.background=new THREE.Color("#141722");
const camera=new THREE.OrthographicCamera(-10,10,6,-6,-100,200);
const TARGET=new THREE.Vector3(9,0.6,7);
const camDir=new THREE.Vector3(1,0.816,1).normalize();
function resetCam(){camera.position.copy(TARGET).addScaledVector(camDir,60);camera.zoom=1;camera.updateProjectionMatrix();controls.target.copy(TARGET);controls.update()}
const controls=new OrbitControls(camera,canvas);
controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minAzimuthAngle=Math.PI/4-0.75;controls.maxAzimuthAngle=Math.PI/4+0.75;
controls.minPolarAngle=0.75;controls.maxPolarAngle=1.15;
controls.minZoom=0.7;controls.maxZoom=3;controls.screenSpacePanning=true;
resetCam();

let PX=innerWidth<600?2:3;
function resize(){const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;
  renderer.setSize(Math.max(1,Math.floor(w/PX)),Math.max(1,Math.floor(h/PX)),false);
  const aspect=w/h,viewH=Math.max(17.5,24.5/aspect);
  camera.left=-viewH*aspect/2;camera.right=viewH*aspect/2;camera.top=viewH/2;camera.bottom=-viewH/2;camera.updateProjectionMatrix()}
new ResizeObserver(resize).observe(stage);

/* ---------- lights ---------- */
scene.add(new THREE.HemisphereLight("#fff6e6","#4a3a30",1.15));
const sun=new THREE.DirectionalLight("#fff1d6",1.5);sun.position.set(-8,16,12);sun.target.position.set(9,0,7);
sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-16,right:16,top:16,bottom:-16,near:1,far:60});sun.shadow.bias=-0.0008;
scene.add(sun,sun.target);
const fill=new THREE.DirectionalLight("#cfe0ff",0.35);fill.position.set(20,10,20);scene.add(fill);

/* ---------- helpers ---------- */
const mats={};
const mat=(c,o={})=>{const k=c+JSON.stringify(o);return mats[k]||(mats[k]=new THREE.MeshLambertMaterial({color:c,...o}))};
function box(w,h,d,c,x,y,z,parent=scene,opt={}){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),typeof c==="string"?mat(c):c);
  m.position.set(x+w/2,y+h/2,z+d/2);m.castShadow=opt.cast!==false;m.receiveShadow=true;parent.add(m);return m}
function ctex(w,h,draw){const c=document.createElement("canvas");c.width=w;c.height=h;const t=c.getContext("2d");draw(t,w,h);
  const tx=new THREE.CanvasTexture(c);tx.magFilter=THREE.NearestFilter;tx.minFilter=THREE.NearestFilter;tx.colorSpace=THREE.SRGBColorSpace;tx.userData={c,t};return tx}
function plane(w,h,material,x,y,z,ry=0,parent=scene){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),material);m.position.set(x,y,z);m.rotation.y=ry;parent.add(m);return m}

/* ---------- floor ---------- */
const W=18,D=14,H=3.2;
const wood=ctex(64,64,(t)=>{t.fillStyle="#c8955c";t.fillRect(0,0,64,64);for(let y=0;y<64;y+=8){t.fillStyle="#ad7a46";t.fillRect(0,y,64,1);t.fillStyle="#d3a26a";t.fillRect(0,y+1,64,1);const s=(y*7)%40+8;t.fillStyle="#ad7a46";t.fillRect(s,y,1,8);t.fillRect((s+30)%64,y,1,8)}});
wood.wrapS=wood.wrapT=THREE.RepeatWrapping;wood.repeat.set(W/4,D/4);
const floor=new THREE.Mesh(new THREE.BoxGeometry(W,0.3,D),new THREE.MeshLambertMaterial({map:wood}));floor.position.set(W/2,-0.15,D/2);floor.receiveShadow=true;scene.add(floor);
/* meeting carpet */
box(7,0.02,6,"#5d6f8f",0,0,0,scene,{cast:false});
/* manager carpet + rug */
box(6,0.02,5,"#3f5a52",12,0,0,scene,{cast:false});box(4,0.03,3,"#b04e44",13,0,1,scene,{cast:false});box(3.4,0.04,2.4,"#c25a4f",13.3,0,1.3,scene,{cast:false});
/* pantry tiles */
const tiles=ctex(16,16,(t)=>{for(let y=0;y<2;y++)for(let x=0;x<2;x++){t.fillStyle=(x+y)%2?"#eef0ea":"#d9dccf";t.fillRect(x*8,y*8,8,8)}t.fillStyle="#c5c8bb";t.fillRect(0,0,16,1);t.fillRect(0,8,16,1);t.fillRect(0,0,1,16);t.fillRect(8,0,1,16)});
tiles.wrapS=tiles.wrapT=THREE.RepeatWrapping;tiles.repeat.set(3,2.5);
const pt=new THREE.Mesh(new THREE.BoxGeometry(6,0.02,5),new THREE.MeshLambertMaterial({map:tiles}));pt.position.set(15,0.01,11.5);pt.receiveShadow=true;scene.add(pt);

/* ---------- outer walls ---------- */
const wallL=mat("#dfe6ee"),wallB=mat("#cdd6e0");
function noShadow(m){m.castShadow=false;return m}
noShadow(box(0.2,H,D+0.2,wallL,-0.2,0,-0.2));
noShadow(box(W,H,0.2,wallB,0,0,-0.2));
box(0.06,0.18,D,"#b6c0cc",0,0,0,scene,{cast:false});box(W,0.18,0.06,"#a9b3bf",0,0,0,scene,{cast:false});
noShadow(box(0.28,0.1,D+0.28,"#8d97a6",-0.24,H,-0.24));noShadow(box(W+0.04,0.1,0.28,"#8d97a6",0,H,-0.24));
/* windows */
const city=ctex(48,24,(t,w,h)=>{const g=t.createLinearGradient(0,0,0,h);g.addColorStop(0,"#8fd0f2");g.addColorStop(1,"#d6f0fb");t.fillStyle=g;t.fillRect(0,0,w,h);
  t.fillStyle="#fff";t.fillRect(6,4,8,2);t.fillRect(8,3,4,1);t.fillRect(30,6,7,2);
  for(let x=0;x<w;x+=3){const bh=6+((x*7)%11);t.fillStyle=(x/3)%2?"#7fa6c4":"#8fb4cf";t.fillRect(x,h-bh,3,bh);t.fillStyle="#c8e4f4";for(let y=h-bh+2;y<h-1;y+=3)t.fillRect(x+1,y,1,1)}});
const glassM=new THREE.MeshBasicMaterial({map:city});
function windowOnLeft(z0,z1){const w=z1-z0;plane(w,2.2,glassM,0.02,1.7,(z0+z1)/2,Math.PI/2);
  for(let z=z0;z<=z1+0.01;z+=w/Math.round(w/1.6))box(0.06,2.3,0.06,"#3b4250",0,0.55,z-0.03);
  box(0.06,0.06,w,"#3b4250",0,0.55,z0);box(0.06,0.06,w,"#3b4250",0,2.8,z0);box(0.06,0.05,w,"#3b4250",0,1.55,z0);}
windowOnLeft(0.6,5.4);windowOnLeft(7,13.4);
/* manager window */

const reportEl=document.getElementById("report"),homeEls=[document.getElementById("home")];
const esc=x=>String(x??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const samplePromise=window.claude?window.claude.use("sample"):Promise.resolve(null);
let curTab="today";
function closeReport(){reportEl.hidden=true;homeEls.forEach(e=>e.hidden=false)}
function openReport(k){
  const c=CREW[k],r=REPORTS[k];homeEls.forEach(e=>e.hidden=true);reportEl.hidden=false;reportEl.style.setProperty("--acc",c.col);
  let h=`<div class="rhead"><button class="back" id="back">← 成員</button><span id="rav"></span><div><b style="color:${c.col}">${esc(c.name)}</b><span>${esc(c.role)}</span></div></div>
  <div class="rmeta"><span>${esc(r.date)}</span><span class="chip demo">示意：以 11/6 資料排版</span></div>`;
  if(k==="tabby"){
    h+=`<p class="quote">「${esc(r.quote)}」</p><div><div class="rmeta" style="margin-bottom:6px">修心策略</div><ul class="rlist">${r.tips.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`;
  }else if(k==="white"){
    h+=`<p class="rsum">${esc(r.summary)}</p><div class="rmeta">今日重點觀察</div><ol class="obs">${r.obs.map(([t,s])=>`<li><div>${esc(t)}<small>資料來源：${esc(s)}</small></div></li>`).join("")}</ol>`;
  }else{
    h+=`<p class="rsum">${esc(r.summary)}</p>
    <div class="rtbl"><table><thead><tr><th>${esc(r.cols[0])}</th><th class="n">${esc(r.cols[1])}</th><th class="n">${esc(r.cols[2])}</th></tr></thead><tbody>${r.kpis.map(([a,b,d,dir])=>`<tr><td>${esc(a)}</td><td class="n">${esc(b)}</td><td class="n ${dir}">${esc(d)}</td></tr>`).join("")}</tbody></table></div>
    <div class="tabs" role="tablist">${[["prev","前一日"],["today","今日"],["next","明日"]].map(([id,l])=>`<button role="tab" data-tab="${id}" aria-selected="${id===curTab}">${l}</button>`).join("")}</div>
    <ul class="rlist" id="tablist" role="tabpanel"></ul>`;
  }
  if(r.src)h+=`<div class="rsrc">資料來源<ul>${r.src.map(id=>`<li><a href="${SRC[id][1]}" target="_blank" rel="noopener">${esc(SRC[id][0])}</a></li>`).join("")}</ul></div>`;
  h+=`<form class="ask" id="askf" hidden><label for="askq">${k==="tabby"?"請斑紋貓聊聊（只談心態與紀律）":"問"+esc(c.name.replace(" ×4",""))+"（只根據這份報告回答）"}</label><div class="askrow"><input id="askq" autocomplete="off" placeholder="${k==="tabby"?"例：連跌六天，我該怎麼穩住心？":"例：今天最該注意哪一點？"}"><button id="askb">問</button></div><p class="ans" id="ans" hidden></p></form>`;
  reportEl.innerHTML=h;reportEl.scrollTop=0;
  document.getElementById("rav").replaceWith(avatar(c,"#23263a"));
  document.getElementById("back").onclick=closeReport;
  const tl=document.getElementById("tablist");
  if(tl){const fill=()=>{tl.innerHTML=r.days[curTab].map(x=>`<li>${esc(x)}</li>`).join("");reportEl.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===curTab))};
    reportEl.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{curTab=b.dataset.tab;fill()});fill()}
  setupAsk(k,c,r);
}
async function setupAsk(k,c,r){
  const sample=await samplePromise;const f=document.getElementById("askf");if(!f||!sample)return;f.hidden=false;
  const q=document.getElementById("askq"),btn=document.getElementById("askb"),ans=document.getElementById("ans");
  f.onsubmit=async e=>{e.preventDefault();const question=q.value.trim();if(!question)return;btn.disabled=true;ans.hidden=false;ans.textContent="想一下…";
    const persona=k==="tabby"?`你是西區交易室茶水間的斑紋貓，負責情緒價值與交易修心。說話溫暖、簡短，只談心態、紀律、停損與等待，絕不給買賣、價位或標的建議。`:`你是西區交易室的${c.name}，負責${c.role}。只根據下面的報告回答，報告沒有的就直說沒有，不要猜，也不要給買賣建議。`;
    const prompt=`${persona}用繁體中文、口語，120 字以內。\n\n報告：${JSON.stringify(r)}\n\n問題：${question}`;
    try{const res=await sample(prompt,{modelTier:"quick",onText:({text})=>{ans.textContent=text}});ans.textContent=res.text}
    catch(err){if(err&&err.code==="not_granted"){f.hidden=true}else ans.textContent=err&&err.code==="rate_limited"?"問太快了，稍等一下再問。":"這次沒有回應，請再按一次。"}
    finally{btn.disabled=false}}
}
/* ---------- picking ---------- */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();let downAt=null;
function pick(e){const r=canvas.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(ndc,camera);
  const hit=ray.intersectObjects(cats,true)[0];return hit?hit.object.userData.catRoot:null}
canvas.addEventListener("pointerdown",e=>{downAt=[e.clientX,e.clientY]});
canvas.addEventListener("pointerup",e=>{if(!downAt)return;const moved=Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1]);downAt=null;if(moved>5)return;const c=pick(e);if(c)select(c.userData.key,false)});
canvas.addEventListener("pointermove",e=>{if(e.buttons)return;canvas.style.cursor=pick(e)?"pointer":"grab"});

/* ---------- tools ---------- */
const pxBtn=document.getElementById("pxBtn");
const PXON=PX;pxBtn.addEventListener("click",()=>{PX=PX===1?PXON:1;pxBtn.setAttribute("aria-pressed",PX!==1);canvas.style.imageRendering=PX!==1?"pixelated":"auto";resize()});
document.getElementById("resetBtn").addEventListener("click",()=>{focusing=0;resetCam()});

/* ---------- clock ---------- */
function tpe(){return new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Taipei"}))}
function tickClock(){const d=tpe();document.getElementById("clock").textContent=`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  const hA=((d.getHours()%12)+d.getMinutes()/60)/12*Math.PI*2,mA=d.getMinutes()/60*Math.PI*2;hourH.rotation.x=-hA;minH.rotation.x=-mA}
hourH.geometry.translate(0,0.07,0);hourH.position.y-=0.07;minH.geometry.translate(0,0.1,0);minH.position.y-=0.1;
tickClock();setInterval(tickClock,30000);

/* ---------- loop ---------- */
let last=0,scrT=0,rackT=0;
function animate(now){
  requestAnimationFrame(animate);
  const t=now/1000,dt=Math.min(0.05,(now-last)/1000||0);last=now;
  if(!reduce){
    scrT+=dt;if(scrT>0.35){scrT=0;screens.forEach(s=>{if(s.userData.scheme.dots&&Math.random()<0.6)drawScreen(s)})}
    rackT+=dt;if(rackT>0.5){rackT=0;drawRack()}
    for(const c of cats){const u=c.userData,p=t*2+u.phase;
      u.body.position.y=Math.abs(Math.sin(p*0.8))*0.03;
      u.tail.forEach((s,i)=>{s.rotation.z=Math.sin(p*1.3+i*0.6)*0.25});
      if(u.kind==="work"){u.armL.rotation.x=Math.sin(p*3)*0.25;u.armR.rotation.x=-Math.sin(p*3)*0.25;u.head.rotation.y=Math.sin(p*0.4)*0.15}
      else if(u.kind==="tea"){const sip=(Math.sin(p*0.5)+1)/2;u.armR.rotation.x=-0.9-sip*0.9;u.head.rotation.x=-sip*0.15;u.armL.rotation.x=0}
      else if(u.kind==="meet"){const talk=Math.sin(p*0.7)>0.6;u.head.rotation.x=talk?Math.sin(p*6)*0.12:0;u.armR.rotation.x=talk?-0.4-Math.sin(p*4)*0.2:0}
    }
    ring.rotation.z+=dt*1.5;rings.forEach(r=>r.rotation.z+=dt*1.5);
  }
  if(focusing){controls.target.lerp(focus,0.08);if(controls.target.distanceTo(focus)<0.02)focusing=0}
  controls.update();renderer.render(scene,camera);
}
resize();requestAnimationFrame(animate);
highlight("brown",false);
</script>
